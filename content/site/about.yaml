headline: Sound, light and space. One instrument.
paragraphs:
  - Psion Systems is a sound, light and experience design studio in London. Tekh Balance started it in 2023 because the best shows treat sound, light and space as one instrument, and most productions split them into three departments.
  - Since then we've built LED installations, lighting rigs and full show systems for festivals, clubs and artists all over. Nearly all of that work found us by word of mouth.
  - 'Bring us the ambitious stuff: custom LED builds, full show programming, jobs that need one crew who can do the lot. Or the easy stuff: a pair of decks, a PA for the weekend, a couple of moving heads for a birthday. It''s all part of the same system.'
