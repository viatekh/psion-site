blurb: The Eleven is a durational artwork, conceived by artist FKA twigs and performed by a rotating group of eleven 'movers.' The piece, developed by twigs over many months, is a physical and artistic quest for self-healing, rooted – in part – in her decades spent in movement practice, somatic healing technique and by implementing conscious action on repeat. twigs herself participated alongside a changing cast of special guests, embodying the method and recording in real time the changes they felt in mind and body. Psion Systems deployed and tuned a timeless Funktion-One sound system with a contemporary low-end flair to soundtrack the two-week performance at Sotheby's, London.
