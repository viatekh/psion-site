blurb: Infinity Rug is a sonic-seance, a deep listening event presenting a soundscape of field recordings, ambient, experimental and deep-mind music, interwoven with ceremonial performances, texts and poetry, scents, textiles and food offerings. Psion Systems designed and programmed a rich and engaging lighting design for the Berlin edition, featuring "Dendrite" — a custom LED installation based on the root systems found beneath our feet.
